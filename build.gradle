// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()   // ← cyclonedx/spdx 플러그인은 Gradle Plugin Portal에 있으므로 추가 필요
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'

        // SBOM 생성용 플러그인 classpath 추가
        classpath 'org.cyclonedx:cyclonedx-gradle-plugin:3.2.4'
        classpath 'org.spdx.sbom:org.spdx.sbom.gradle.plugin:0.11.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
